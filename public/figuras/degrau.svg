<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Geometria de degraus: piso b e espelho h</title><rect width="900" height="440" rx="12" fill="#0b2037"/><g fill="#e6effa" font-family="Arial,sans-serif"><text x="30" y="38" font-size="24">Escada: cada degrau faz parte do percurso</text><path d="M100 320H280V245H460V170H640V95H800" fill="none" stroke="#bcd1e7" stroke-width="12"/><path d="M310 277L440 277" stroke="#ffd65b" stroke-width="2" fill="none"/><text x="340" y="303" font-size="18">piso b</text><path d="M490 190L490 232" stroke="#ffd65b" stroke-width="2" fill="none"/><text x="510" y="225" font-size="18">espelho h</text><text x="100" y="375" font-size="20">Exemplo geométrico: h = 17 cm e b = 29 cm → 2h + b = 63 cm</text><text x="100" y="410" font-size="17">Não define sozinho largura, tipo de escada, patamares ou saídas.</text></g></svg>