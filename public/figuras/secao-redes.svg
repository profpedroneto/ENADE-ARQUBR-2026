<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Corte esquemático com laje, viga, redes e forro</title><rect width="900" height="440" rx="12" fill="#0b2037"/><g fill="#e6effa" font-family="Arial,sans-serif"><text x="30" y="38" font-size="24">Compatibilize alturas, além de conferir a planta</text><rect x="70" y="90" width="760" height="25" fill="#7f96ac" stroke="#bcd1e7" stroke-width="2"/><rect x="380" y="115" width="80" height="100" fill="#7f96ac" stroke="#bcd1e7" stroke-width="2"/><path d="M70 275L830 275" stroke="#9aaec3" stroke-width="3" fill="none"/><path d="M70 215L350 215" stroke="#8fc8ff" stroke-width="9" fill="none"/><path d="M480 215L830 215" stroke="#8fc8ff" stroke-width="9" fill="none"/><path d="M350 215L480 215" stroke="#ff8d9d" stroke-width="5" fill="none"/><text x="80" y="77" font-size="18">Laje</text><text x="480" y="155" font-size="18">Viga</text><text x="80" y="200" font-size="18">Rede com declividade / cota</text><text x="80" y="315" font-size="18">Forro e altura livre do ambiente</text><text x="80" y="365" font-size="19">O trecho vermelho indica uma interferência a resolver.</text><text x="80" y="402" font-size="18">Desviar, mudar cotas ou prever reserva exige coordenação.</text></g></svg>