<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Percursos funcionais de água, esgoto e chuva</title><rect width="900" height="440" rx="12" fill="#0b2037"/><g fill="#e6effa" font-family="Arial,sans-serif"><text x="30" y="38" font-size="23">Redes diferentes, percursos e verificações diferentes</text><text x="35" y="105" font-size="20">Água de abastecimento</text><text x="35" y="200" font-size="20">Esgoto sanitário</text><text x="35" y="295" font-size="20">Água da chuva</text><text x="35" y="135" font-size="18">Reservação → distribuição → consumo</text><text x="35" y="230" font-size="18">Aparelho → desconector → coleta → destinação</text><text x="35" y="325" font-size="18">Cobertura → captação → condutor → destinação pluvial</text><text x="35" y="390" font-size="20">Pressão / vazão • declividade / ventilação • chuva / área contribuinte</text></g></svg>