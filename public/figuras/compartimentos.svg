<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Compartimentação horizontal em planta e vertical em corte</title><rect width="900" height="440" rx="12" fill="#0b2037"/><g fill="#e6effa" font-family="Arial,sans-serif"><text x="30" y="35" font-size="24">Compartimentação é continuidade de proteção</text><text x="50" y="78" font-size="18">PLANTA · propagação no pavimento</text><rect x="50" y="105" width="350" height="230" fill="#173855" stroke="#bcd1e7" stroke-width="2"/><path d="M225 105L225 335" stroke="#ffd65b" stroke-width="10" fill="none"/><rect x="215" y="220" width="20" height="45" fill="#6fd4ad" stroke="#bcd1e7" stroke-width="2"/><text x="70" y="165" font-size="18">Setor A</text><text x="255" y="165" font-size="18">Setor B</text><text x="80" y="300" font-size="17">PCF na passagem</text><text x="470" y="78" font-size="18">CORTE · propagação entre pisos</text><rect x="470" y="105" width="350" height="230" fill="#173855" stroke="#bcd1e7" stroke-width="2"/><path d="M470 220L820 220" stroke="#ffd65b" stroke-width="12" fill="none"/><rect x="690" y="105" width="55" height="230" fill="#18374f" stroke="#bcd1e7" stroke-width="2"/><path d="M690 220L745 220" stroke="#ff8d9d" stroke-width="12" fill="none"/><text x="490" y="155" font-size="17">Pavimento 2</text><text x="490" y="290" font-size="17">Pavimento 1</text><text x="755" y="180" font-size="15">Shaft</text><text x="50" y="385" font-size="19">Parede + porta + encontros</text><text x="470" y="385" font-size="19">Laje + shafts + selagens + fachada</text><text x="50" y="420" font-size="17">Verde: porta protegida · vermelho: passagem cuja proteção precisa ser especificada.</text></g></svg>