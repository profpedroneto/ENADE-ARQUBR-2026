<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Diagramas conceituais dos acessos a escadas NE, EP e PF</title><rect width="900" height="440" rx="12" fill="#0b2037"/><g fill="#e6effa" font-family="Arial,sans-serif"><text x="30" y="38" font-size="25">NE, EP e PF: o acesso faz diferença</text><text x="35" y="90" font-size="21">NE · não enclausurada</text><text x="35" y="120" font-size="17">Circulação → escada</text><rect x="380" y="65" width="450" height="70" fill="#173855" stroke="#bcd1e7" stroke-width="2"/><text x="420" y="109" font-size="18">Escada comum</text><text x="35" y="195" font-size="21">EP · enclausurada protegida</text><text x="35" y="225" font-size="17">Circulação → PCF → caixa</text><rect x="380" y="170" width="450" height="70" fill="#173855" stroke="#bcd1e7" stroke-width="2"/><rect x="380" y="188" width="15" height="34" fill="#ffd65b" stroke="#bcd1e7" stroke-width="2"/><text x="420" y="213" font-size="18">Caixa com proteção e ventilação</text><text x="35" y="302" font-size="21">PF · à prova de fumaça</text><text x="35" y="332" font-size="17">Circulação → acesso protegido</text><rect x="380" y="275" width="170" height="80" fill="#215148" stroke="#bcd1e7" stroke-width="2"/><rect x="570" y="275" width="260" height="80" fill="#173855" stroke="#bcd1e7" stroke-width="2"/><rect x="380" y="298" width="15" height="34" fill="#ffd65b" stroke="#bcd1e7" stroke-width="2"/><rect x="570" y="298" width="15" height="34" fill="#ffd65b" stroke="#bcd1e7" stroke-width="2"/><text x="403" y="320" font-size="17">Antecâmara</text><text x="610" y="320" font-size="18">Caixa de escada</text><text x="35" y="395" font-size="17">Esquema de relações, não planta executiva. PF também admite acessos previstos na NPT.</text><text x="35" y="422" font-size="17">Escolha o tipo pelo enquadramento e Anexo C da NPT 011, incluindo suas notas.</text></g></svg>