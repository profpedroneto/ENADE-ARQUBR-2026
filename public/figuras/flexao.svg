<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Comparação das regiões tracionadas em uma viga e um balanço</title><rect width="900" height="440" rx="12" fill="#0b2037"/><g fill="#e6effa" font-family="Arial,sans-serif"><text x="30" y="38" font-size="24">A posição da tração depende dos apoios</text><text x="55" y="95" font-size="18">Viga biapoiada</text><rect x="55" y="140" width="330" height="40" fill="#173855" stroke="#bcd1e7" stroke-width="2"/><path d="M70 175L370 175" stroke="#ff8d9d" stroke-width="6" fill="none"/><path d="M70 181l-15 25h30ZM370 181l-15 25h30Z" fill="#9ab3cc"/><text x="55" y="250" font-size="18">Tração inferior no trecho central</text><text x="495" y="95" font-size="18">Balanço com carga descendente</text><rect x="495" y="140" width="330" height="40" fill="#173855" stroke="#bcd1e7" stroke-width="2"/><rect x="470" y="105" width="25" height="120" fill="#7f96ac" stroke="#bcd1e7" stroke-width="2"/><path d="M505 145L810 145" stroke="#ff8d9d" stroke-width="6" fill="none"/><text x="495" y="250" font-size="18">Tração superior junto ao engaste</text><text x="55" y="340" font-size="19">Os esquemas representam hipóteses específicas de carga e vínculo.</text><text x="55" y="385" font-size="19">Viga recebe flexão; tirante transmite predominantemente tração.</text></g></svg>