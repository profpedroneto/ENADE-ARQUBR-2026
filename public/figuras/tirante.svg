<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Tirante e ancoragem em uma cobertura suspensa</title><rect width="900" height="440" rx="12" fill="#0b2037"/><g fill="#e6effa" font-family="Arial,sans-serif"><text x="30" y="38" font-size="24">Tirante: elemento que transmite tração</text><rect x="140" y="90" width="28" height="260" fill="#5d7792" stroke="#bcd1e7" stroke-width="2"/><rect x="140" y="280" width="500" height="20" fill="#5d7792" stroke="#bcd1e7" stroke-width="2"/><path d="M162 100L620 278" stroke="#ffd65b" stroke-width="7" fill="none"/><rect x="145" y="88" width="30" height="25" fill="#b67a61" stroke="#bcd1e7" stroke-width="2"/><rect x="607" y="265" width="30" height="28" fill="#b67a61" stroke="#bcd1e7" stroke-width="2"/><text x="350" y="145" font-size="21">TIRANTE</text><path d="M410 153L410 194" stroke="#ffd65b" stroke-width="2" fill="none"/><text x="45" y="340" font-size="18">Apoio resistente</text><text x="440" y="340" font-size="18">Viga / cobertura</text><text x="35" y="385" font-size="18">Ancoragem: a ligação transfere a força do tirante ao apoio.</text><text x="35" y="413" font-size="17">O apoio e a fundação também precisam receber essa força.</text></g></svg>